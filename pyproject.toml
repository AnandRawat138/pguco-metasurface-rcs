[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metasurface-optimizer"
version = "0.1.0"
description = "Physics-guided, simulation-efficient counterfactual optimization of existing electromagnetic metasurfaces"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "xgboost>=2.0", "torch>=2.1",
  "matplotlib>=3.7", "trimesh>=4.0", "shapely>=2.0", "manifold3d", "mapbox_earcut", "pyyaml>=6", "pillow>=10",
  "pymupdf>=1.23", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart", "cloudpickle",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx"]

[tool.setuptools.packages.find]
include = ["metasurface_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

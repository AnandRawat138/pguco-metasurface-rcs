# Example schema for a periodic FSS unit cell (rectangular patch), used by the HFSS
# automation tests and as a starting point for a real Floquet template.
name: fss_patch_example
version: "1.0"
template: rect_patch
length_unit: mm
manufacturing: {min_gap: 0.2, min_feature: 0.2, max_substrate_thickness: 5.0, metal_thickness: 0.035}
parameters:
  - {name: period, type: continuous, min: 8.0, max: 12.0, unit: mm, default: 10.0, step: 0.3, role: period}
  - {name: patch_length, type: continuous, min: 5.0, max: 11.0, unit: mm, default: 8.0, step: 0.3, role: length}
  - {name: patch_width, type: continuous, min: 0.5, max: 4.0, unit: mm, default: 1.0, step: 0.2, role: width}
  - {name: substrate_thickness, type: continuous, min: 0.2, max: 3.0, unit: mm, default: 0.8, fixed: true, role: thickness}
  - {name: eps_r, type: continuous, min: 2.0, max: 4.0, unit: "1", default: 3.55, fixed: true, role: permittivity}
  - {name: tan_delta, type: continuous, min: 0.0, max: 0.01, unit: "1", default: 0.0027, fixed: true, role: loss_tangent}
  - {name: ground, type: continuous, min: 0.0, max: 1.0, unit: "1", default: 0.0, fixed: true, role: other}
